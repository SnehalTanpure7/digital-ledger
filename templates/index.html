<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Smart Khata | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body class="login-page">

    <main class="login-shell">

        <!-- ================= LEFT BRAND SECTION ================= -->

        <section class="login-brand-panel d-none d-lg-flex">

            <a class="brand brand-light" href="#">
                <span class="brand-mark">
                    <i class="bi bi-journal-check"></i>
                </span>

                <span>Smart Khata</span>
            </a>
            <div class="brand-copy">
                <span class="eyebrow eyebrow-light">
                    KHATA, MADE SIMPLE
                </span>
                <h1>
                    Every credit, clearly accounted for.
                </h1>
                <p>
                    Keep your customers, udhaar and payments organised
                    in one simple place.
                </p>
            </div>
            <div class="brand-stat">

                <i class="bi bi-shield-check"></i>

                Secure & simple shopkeeping

            </div>

        </section>


        <!-- ================= LOGIN SECTION ================= -->

        <section class="login-form-panel">

            <div class="login-card">


                <!-- Mobile Logo -->

                <a class="brand brand-dark d-lg-none" href="#">

                    <span class="brand-mark">
                        <i class="bi bi-journal-check"></i>
                    </span>

                    <span>Smart Khata</span>

                </a>


                <!-- Heading -->

                <span class="eyebrow">
                    SHOPKEEPER PORTAL
                </span>

                <h2>
                    Welcome back
                </h2>

                <p class="text-secondary mb-4">
                    Sign in to manage your customer khata.
                </p>
                <form method="POST" action="{{ url_for('index') }}">

                    <!-- Email / Mobile -->
                    <div class="mb-3">

                        <label for="loginId" class="form-label">
                            Mobile number or email
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input class="form-control" id="loginId" name="email" type="text"
                                placeholder="Enter mobile or email" autocomplete="username" required>

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <div class="d-flex justify-content-between">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <a href="#" class="small-link">
                                Forgot password?
                            </a>

                        </div>


                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input class="form-control" id="password" name="password" type="password"
                                placeholder="Enter your password" autocomplete="current-password" required>

                            <!-- Show / Hide Password -->

                            <button class="btn password-toggle" type="button" id="togglePassword"
                                aria-label="Show password">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Remember Me -->
                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div class="form-check">

                            <input class="form-check-input" type="checkbox" id="remember">

                            <label class="form-check-label" for="remember">

                                Remember me

                            </label>

                        </div>

                    </div>


                    <!-- Login Button -->
                    <button class="btn btn-primary w-100 login-button" type="submit">

                        Login

                        <i class="bi bi-arrow-right ms-1"></i>

                    </button>

                </form>
                <div id="loginMessage" class="login-message d-none">
                </div>
            </div>

        </section>

    </main>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Your JS -->

    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
